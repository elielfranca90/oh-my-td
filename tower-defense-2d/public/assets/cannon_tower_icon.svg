<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d1e03" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1a0c02" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#080402" stop-opacity="0"/>
    </radialGradient>

    <!-- Metal Steel Armor Gradients -->
    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a525d"/>
      <stop offset="30%" stop-color="#262930"/>
      <stop offset="70%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>

    <linearGradient id="midSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#697686"/>
      <stop offset="40%" stop-color="#404854"/>
      <stop offset="100%" stop-color="#1d2128"/>
    </linearGradient>

    <linearGradient id="lightSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b9bb4"/>
      <stop offset="50%" stop-color="#5a6577"/>
      <stop offset="100%" stop-color="#343b47"/>
    </linearGradient>

    <linearGradient id="bevelHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0c4de" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Fiery Ember & Energy Gradients -->
    <linearGradient id="fireOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3300"/>
      <stop offset="50%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>

    <radialGradient id="moltenCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffea00"/>
      <stop offset="55%" stop-color="#ff5500"/>
      <stop offset="85%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#3a0000"/>
    </radialGradient>

    <linearGradient id="heatSinkGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff1a00"/>
      <stop offset="60%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffee55"/>
    </linearGradient>

    <!-- Bronze / Gold Accent Trim -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e69d24"/>
      <stop offset="50%" stop-color="#995e14"/>
      <stop offset="100%" stop-color="#472a04"/>
    </linearGradient>

    <!-- Barrel Metallic Gradient (Perpendicular Shading) -->
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#525c6b"/>
      <stop offset="20%" stop-color="#2d333d"/>
      <stop offset="50%" stop-color="#181b21"/>
      <stop offset="80%" stop-color="#38404d"/>
      <stop offset="100%" stop-color="#0f1114"/>
    </linearGradient>

    <!-- Base Ring Metallic Gradient -->
    <linearGradient id="baseRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c313a"/>
      <stop offset="50%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    
    <filter id="intenseMuzzleGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feComponentTransfer in="blur1" result="brightBlur">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- ==================== BASE / PEDESTAL LAYER ==================== -->
  <g id="base-platform" filter="url(#dropShadow)">
    <!-- Base Shadow Outer -->
    <ellipse cx="256" cy="420" rx="190" ry="55" fill="#050302" opacity="0.9"/>

    <!-- Bottom Concrete/Iron Base Plate -->
    <path d="M 85,380 L 145,445 L 367,445 L 427,380 L 390,340 L 122,340 Z" fill="url(#darkSteel)" stroke="#121417" stroke-width="3"/>
    
    <!-- Outer Rim Cutout Facets -->
    <path d="M 85,380 L 145,445 L 367,445 L 427,380 L 415,365 L 360,425 L 152,425 L 97,365 Z" fill="#15171c"/>

    <!-- Reinforced Base Ring (Isometric Outer Platform) -->
    <ellipse cx="256" cy="360" rx="165" ry="50" fill="url(#baseRing)" stroke="#3a424e" stroke-width="4"/>
    <ellipse cx="256" cy="360" rx="145" ry="43" fill="#0d0e12" stroke="#1a1c23" stroke-width="2"/>

    <!-- Glowing Energy Trenches in Base -->
    <ellipse cx="256" cy="360" rx="135" ry="39" fill="none" stroke="#ff4400" stroke-width="3" filter="url(#glowSoft)" opacity="0.7"/>
    
    <!-- Base Armor Segment Plate -->
    <path d="M 130,360 A 135 39 0 0 0 382,360 L 360,360 A 115 32 0 0 1 152,360 Z" fill="url(#midSteel)"/>
    
    <!-- Rotating Turret Swivel Ring Hub -->
    <ellipse cx="256" cy="355" rx="110" ry="30" fill="url(#darkSteel)" stroke="#4f5969" stroke-width="3"/>
    <ellipse cx="256" cy="355" rx="90" ry="24" fill="#0a0b0d"/>
    <ellipse cx="256" cy="355" rx="85" ry="22" fill="none" stroke="#ff8800" stroke-width="2" filter="url(#glowSoft)"/>

    <!-- Base Rivets/Bolts -->
    <circle cx="150" cy="370" r="4" fill="url(#lightSteel)"/>
    <circle cx="362" cy="370" r="4" fill="url(#lightSteel)"/>
    <circle cx="200" cy="390" r="4" fill="url(#lightSteel)"/>
    <circle cx="312" cy="390" r="4" fill="url(#lightSteel)"/>
    <circle cx="256" cy="397" r="4.5" fill="url(#lightSteel)"/>
  </g>

  <!-- ==================== CANNON MOUNT & HYDRAULICS ==================== -->
  <g id="turret-swivel-mount">
    <!-- Heavy Mount Chassis Side Pillars -->
    <!-- Left Pillar -->
    <path d="M 165,340 L 150,260 L 195,235 L 215,325 Z" fill="url(#darkSteel)" stroke="#1a1d24" stroke-width="2"/>
    <path d="M 195,235 L 215,325 L 210,345 L 180,345 Z" fill="url(#midSteel)"/>
    
    <!-- Right Pillar -->
    <path d="M 347,340 L 362,260 L 317,235 L 297,325 Z" fill="url(#darkSteel)" stroke="#1a1d24" stroke-width="2"/>
    <path d="M 317,235 L 297,325 L 302,345 L 332,345 Z" fill="url(#midSteel)"/>

    <!-- Hydraulic Recoil Pistons -->
    <!-- Left Piston -->
    <rect x="180" y="270" width="16" height="50" rx="4" transform="rotate(15 180 270)" fill="url(#lightSteel)"/>
    <rect x="183" y="280" width="10" height="30" rx="2" transform="rotate(15 180 270)" fill="url(#fireOrange)" filter="url(#glowSoft)"/>
    <!-- Right Piston -->
    <rect x="316" y="270" width="16" height="50" rx="4" transform="rotate(-15 316 270)" fill="url(#lightSteel)"/>
    <rect x="319" y="280" width="10" height="30" rx="2" transform="rotate(-15 316 270)" fill="url(#fireOrange)" filter="url(#glowSoft)"/>
  </g>

  <!-- ==================== TWIN CANNON BARRELS ==================== -->
  <!-- Elevation Angle: Aimed Upwards and Right/Forward (-25 deg tilt perspective) -->
  <g id="twin-barrels" filter="url(#dropShadow)">
    
    <!-- ================= LEFT BARREL (BACKGROUND) ================= -->
    <g id="left-barrel">
      <!-- Main Barrel Shaft -->
      <path d="M 180,250 L 115,100 L 155,83 L 220,233 Z" fill="url(#barrelGrad)"/>
      
      <!-- Top Highlight Line -->
      <path d="M 180,250 L 115,100 L 122,97 L 187,247 Z" fill="url(#bevelHighlight)" opacity="0.6"/>

      <!-- Fiery Heat Vents (Glowing Slots along Left Barrel Body) -->
      <g fill="url(#heatSinkGlow)" filter="url(#glowSoft)">
        <polygon points="172,225 167,213 137,144 142,142 172,211"/>
        <polygon points="180,222 175,210 145,141 150,139 180,208"/>
      </g>
      <g fill="#121419">
        <!-- Vent Grill Ribs -->
        <rect x="156" y="180" width="22" height="3" transform="rotate(66 156 180)"/>
        <rect x="148" y="160" width="22" height="3" transform="rotate(66 148 160)"/>
        <rect x="140" y="140" width="22" height="3" transform="rotate(66 140 140)"/>
      </g>

      <!-- Reinforced Barrel Rings / Collars -->
      <!-- Ring 1 (Mid) -->
      <path d="M 160,205 L 140,158 L 156,151 L 176,198 Z" fill="url(#midSteel)" stroke="#0d0e12" stroke-width="1.5"/>
      <path d="M 160,205 L 140,158 L 144,156 L 164,203 Z" fill="url(#bevelHighlight)" opacity="0.5"/>
      <!-- Ring 2 (Front Heavy Sleeve) -->
      <path d="M 134,144 L 109,86 L 129,78 L 154,136 Z" fill="url(#darkSteel)" stroke="#0d0e12" stroke-width="1.5"/>
      <path d="M 134,144 L 109,86 L 113,84 L 138,142 Z" fill="url(#bevelHighlight)" opacity="0.5"/>

      <!-- Muzzle Brake (Left Barrel Tip) -->
      <path d="M 112,93 L 94,51 L 120,40 L 138,82 Z" fill="url(#midSteel)" stroke="#101216" stroke-width="2"/>
      <!-- Muzzle Flare Ring -->
      <path d="M 96,56 L 89,40 L 121,27 L 128,43 Z" fill="url(#goldTrim)"/>

      <!-- Inner Barrel Core Glow (Left Muzzle Hole) -->
      <ellipse cx="106" cy="34" rx="17" ry="8" transform="rotate(-23 106 34)" fill="url(#moltenCore)" filter="url(#intenseMuzzleGlow)"/>
      <ellipse cx="106" cy="34" rx="11" ry="5" transform="rotate(-23 106 34)" fill="#ffffff"/>
    </g>

    <!-- ================= RIGHT BARREL (FOREGROUND) ================= -->
    <g id="right-barrel">
      <!-- Main Barrel Shaft -->
      <path d="M 285,250 L 220,100 L 260,83 L 325,233 Z" fill="url(#barrelGrad)"/>
      
      <!-- Top Highlight Line -->
      <path d="M 285,250 L 220,100 L 227,97 L 292,247 Z" fill="url(#bevelHighlight)" opacity="0.6"/>

      <!-- Fiery Heat Vents (Glowing Slots along Right Barrel Body) -->
      <g fill="url(#heatSinkGlow)" filter="url(#glowSoft)">
        <polygon points="277,225 272,213 242,144 247,142 277,211"/>
        <polygon points="285,222 280,210 250,141 255,139 285,208"/>
      </g>
      <g fill="#121419">
        <!-- Vent Grill Ribs -->
        <rect x="261" y="180" width="22" height="3" transform="rotate(66 261 180)"/>
        <rect x="253" y="160" width="22" height="3" transform="rotate(66 253 160)"/>
        <rect x="245" y="140" width="22" height="3" transform="rotate(66 245 140)"/>
      </g>

      <!-- Reinforced Barrel Rings / Collars -->
      <!-- Ring 1 (Mid) -->
      <path d="M 265,205 L 245,158 L 261,151 L 281,198 Z" fill="url(#midSteel)" stroke="#0d0e12" stroke-width="1.5"/>
      <path d="M 265,205 L 245,158 L 249,156 L 269,203 Z" fill="url(#bevelHighlight)" opacity="0.5"/>
      <!-- Ring 2 (Front Heavy Sleeve) -->
      <path d="M 239,144 L 214,86 L 234,78 L 259,136 Z" fill="url(#darkSteel)" stroke="#0d0e12" stroke-width="1.5"/>
      <path d="M 239,144 L 214,86 L 218,84 L 243,142 Z" fill="url(#bevelHighlight)" opacity="0.5"/>

      <!-- Muzzle Brake (Right Barrel Tip) -->
      <path d="M 217,93 L 199,51 L 225,40 L 243,82 Z" fill="url(#midSteel)" stroke="#101216" stroke-width="2"/>
      <!-- Muzzle Flare Ring -->
      <path d="M 201,56 L 194,40 L 226,27 L 233,43 Z" fill="url(#goldTrim)"/>

      <!-- Inner Barrel Core Glow (Right Muzzle Hole) -->
      <ellipse cx="211" cy="34" rx="17" ry="8" transform="rotate(-23 211 34)" fill="url(#moltenCore)" filter="url(#intenseMuzzleGlow)"/>
      <ellipse cx="211" cy="34" rx="11" ry="5" transform="rotate(-23 211 34)" fill="#ffffff"/>
    </g>

  </g>

  <!-- ================= HEAVY TURRET BREECH & ARMOR HOUSING ================= -->
  <g id="main-turret-body" filter="url(#dropShadow)">
    
    <!-- Turret Armor Base Mantle (Under Structure) -->
    <path d="M 160,280 L 175,220 L 330,220 L 345,280 L 310,330 L 195,330 Z" fill="#121418"/>

    <!-- Sloped Front Armor Shield Plate -->
    <path d="M 170,270 L 190,205 L 315,205 L 335,270 L 295,315 L 210,315 Z" fill="url(#darkSteel)" stroke="#1d2128" stroke-width="2"/>
    
    <!-- Top Face Armor Canopy -->
    <path d="M 190,205 L 220,165 L 285,165 L 315,205 L 256,215 Z" fill="url(#lightSteel)"/>
    <!-- Top Edge Highlight -->
    <path d="M 220,165 L 285,165 L 280,168 L 225,168 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Central Reactor/Heat Exhaust Core (Top Turret Vent) -->
    <polygon points="230,175 282,175 277,198 235,198" fill="#0a0502" stroke="#2d333f" stroke-width="2"/>
    <!-- Glowing Heat Fins -->
    <g fill="url(#heatSinkGlow)" filter="url(#glowSoft)">
      <rect x="238" y="178" width="36" height="2" rx="1"/>
      <rect x="237" y="183" width="38" height="2" rx="1"/>
      <rect x="236" y="188" width="40" height="2" rx="1"/>
      <rect x="235" y="193" width="42" height="2" rx="1"/>
    </g>

    <!-- Front Center Crest Plate (Heavy Reinforced Nose) -->
    <path d="M 215,265 L 230,215 L 282,215 L 297,265 L 256,295 Z" fill="url(#midSteel)" stroke="#121418" stroke-width="2"/>
    <!-- Crest Bevel Highlights -->
    <path d="M 230,215 L 282,215 L 278,220 L 234,220 Z" fill="url(#bevelHighlight)" opacity="0.8"/>
    <path d="M 215,265 L 230,215 L 234,220 L 221,263 Z" fill="url(#bevelHighlight)" opacity="0.4"/>

    <!-- Glowing Energy Inlays on Front Armor -->
    <path d="M 235,230 L 256,250 L 277,230" fill="none" stroke="#ff5500" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowHeavy)"/>
    <path d="M 235,230 L 256,250 L 277,230" fill="none" stroke="#ffffaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left & Right Heavy Cheek Plates (Side Armor Bulwarks) -->
    <!-- Left Cheek Plate -->
    <path d="M 165,265 L 190,205 L 215,265 L 195,305 Z" fill="url(#darkSteel)" stroke="#15171c" stroke-width="2"/>
    <path d="M 165,265 L 190,205 L 193,212 L 171,265 Z" fill="url(#bevelHighlight)" opacity="0.5"/>
    <path d="M 168,262 L 188,215" stroke="#ff6600" stroke-width="2" filter="url(#glowSoft)"/>
    <!-- Gold Trim Accent Left -->
    <path d="M 195,305 L 165,265 L 172,260 L 198,295 Z" fill="url(#goldTrim)"/>

    <!-- Right Cheek Plate -->
    <path d="M 347,265 L 322,205 L 297,265 L 317,305 Z" fill="url(#darkSteel)" stroke="#15171c" stroke-width="2"/>
    <path d="M 322,205 L 347,265 L 341,265 L 319,212 Z" fill="url(#bevelHighlight)" opacity="0.3"/>
    <path d="M 344,262 L 324,215" stroke="#ff6600" stroke-width="2" filter="url(#glowSoft)"/>
    <!-- Gold Trim Accent Right -->
    <path d="M 317,305 L 347,265 L 340,260 L 314,295 Z" fill="url(#goldTrim)"/>

    <!-- Heavy Industrial Bolts / Rivets on Armor Body -->
    <g fill="url(#lightSteel)" stroke="#0d0e10" stroke-width="0.5">
      <!-- Nose Rivets -->
      <circle cx="236" cy="223" r="2.5"/>
      <circle cx="276" cy="223" r="2.5"/>
      <circle cx="224" cy="260" r="2.5"/>
      <circle cx="288" cy="260" r="2.5"/>
      <circle cx="256" cy="286" r="2.5"/>

      <!-- Cheek Rivets Left -->
      <circle cx="178" cy="262" r="2.5"/>
      <circle cx="197" cy="220" r="2.5"/>

      <!-- Cheek Rivets Right -->
      <circle cx="334" cy="262" r="2.5"/>
      <circle cx="315" cy="220" r="2.5"/>
    </g>
  </g>

  <!-- ================= DYNAMIC FX: EMBERS, HEAT & SPARKS ================= -->
  <g id="explosive-fx">
    <!-- Glowing Heat Aura around Muzzles -->
    <circle cx="106" cy="34" r="35" fill="url(#moltenCore)" opacity="0.25" filter="url(#glowHeavy)"/>
    <circle cx="211" cy="34" r="35" fill="url(#moltenCore)" opacity="0.25" filter="url(#glowHeavy)"/>

    <!-- Floating Fiery Embers & Sparks -->
    <!-- Large Embers -->
    <circle cx="90" cy="70" r="3.5" fill="#ffea00" filter="url(#glowSoft)"/>
    <circle cx="130" cy="25" r="2.5" fill="#ff5500" filter="url(#glowSoft)"/>
    <circle cx="240" cy="15" r="3" fill="#ffaa00" filter="url(#glowSoft)"/>
    <circle cx="190" cy="50" r="2" fill="#ffee77" filter="url(#glowSoft)"/>
    <circle cx="270" cy="65" r="3.5" fill="#ff3300" filter="url(#glowSoft)"/>
    
    <!-- Floating Spark Diamonds -->
    <polygon points="100,120 103,125 100,130 97,125" fill="#ffdd44" opacity="0.8" filter="url(#glowSoft)"/>
    <polygon points="220,100 222,103 220,106 218,103" fill="#ffaa00" opacity="0.9"/>
    <polygon points="150,40 153,44 150,48 147,44" fill="#ffffff" filter="url(#glowSoft)"/>
    <polygon points="310,140 313,143 310,146 307,143" fill="#ff4400" opacity="0.7"/>

    <!-- Micro Sparks -->
    <circle cx="75" cy="90" r="1.5" fill="#ffcc00"/>
    <circle cx="115" cy="110" r="1" fill="#ff8800"/>
    <circle cx="165" cy="15" r="1.5" fill="#ffffff"/>
    <circle cx="200" cy="80" r="1" fill="#ffaa00"/>
    <circle cx="255" cy="40" r="1.5" fill="#ffee55"/>
    <circle cx="285" cy="95" r="1" fill="#ff3300"/>
    <circle cx="330" cy="170" r="1.5" fill="#ffaa00" filter="url(#glowSoft)"/>
    <circle cx="140" cy="290" r="2" fill="#ff5500" filter="url(#glowSoft)"/>
    <circle cx="360" cy="280" r="1.5" fill="#ff8800" filter="url(#glowSoft)"/>
  </g>

</svg>