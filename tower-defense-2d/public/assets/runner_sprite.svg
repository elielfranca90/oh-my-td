<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="ultra-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feGaussianBlur stdDeviation="30" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="plasma-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <!-- Metallic Dark Gold Gradients -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#F1A80A" />
      <stop offset="70%" stop-color="#995D00" />
      <stop offset="100%" stop-color="#4A2E00" />
    </linearGradient>

    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA8010" />
      <stop offset="50%" stop-color="#664200" />
      <stop offset="100%" stop-color="#291A00" />
    </linearGradient>

    <!-- Vibrant Orange Energy Gradients -->
    <linearGradient id="orange-energy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD500" />
      <stop offset="40%" stop-color="#FF5500" />
      <stop offset="90%" stop-color="#FF0044" />
      <stop offset="100%" stop-color="#B30000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orange-energy-reverse" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="30%" stop-color="#FF7700" />
      <stop offset="75%" stop-color="#DD1100" />
      <stop offset="100%" stop-color="#550000" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="core-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFEA66" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0" />
    </radialGradient>

    <!-- Dark Bio-Armor Gradients -->
    <linearGradient id="obsidian-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2536" />
      <stop offset="50%" stop-color="#17121D" />
      <stop offset="100%" stop-color="#09060C" />
    </linearGradient>

    <linearGradient id="obsidian-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5E4C6E" />
      <stop offset="40%" stop-color="#211928" />
      <stop offset="100%" stop-color="#0D0912" />
    </linearGradient>

    <!-- Motion Trail Gradients -->
    <linearGradient id="trail-line" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFBB00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF3300" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#880000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="blade-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFCC00" />
      <stop offset="70%" stop-color="#FF4400" />
      <stop offset="100%" stop-color="#990000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND MOTION TRAILS & AFTER-IMAGES -->
  <g id="motion-effects">
    <!-- Speed Distortion Streams -->
    <path d="M-20 360 C 100 350, 180 380, 280 370 C 220 395, 100 400, -20 380 Z" fill="url(#trail-line)" opacity="0.7" />
    <path d="M 10 220 C 130 200, 240 230, 320 200 C 240 235, 120 230, 10 250 Z" fill="url(#trail-line)" opacity="0.5" />
    <path d="M -50 140 C 80 130, 200 170, 300 130 C 200 175, 70 170, -50 150 Z" fill="url(#trail-line)" opacity="0.6" opacity="0.3" />
    
    <!-- Kinetic Energy Ribbons -->
    <path d="M 350 170 Q 200 190 40 130 Q 180 220 310 230 Z" fill="url(#orange-energy-reverse)" opacity="0.8" filter="url(#soft-glow)" />
    <path d="M 280 290 Q 150 330 0 310 Q 140 370 260 360 Z" fill="url(#orange-energy-reverse)" opacity="0.8" filter="url(#soft-glow)" />

    <!-- Plasma Sparks & Particles -->
    <g fill="#FFCC00" filter="url(#soft-glow)">
      <circle cx="180" cy="160" r="3" />
      <circle cx="120" cy="180" r="4.5" />
      <circle cx="220" cy="140" r="2" />
      <circle cx="90"  cy="280" r="3.5" />
      <circle cx="150" cy="320" r="2" />
      <circle cx="40"  cy="340" r="5" />
      <circle cx="200" cy="390" r="3" />
      <polygon points="130,220 145,215 135,225" />
      <polygon points="70,300 90,295 78,308" />
      <polygon points="210,120 230,118 218,128" />
    </g>

    <!-- Ground Speed Flare / Dust Arc -->
    <path d="M 220 440 Q 310 430 420 450 Q 330 465 200 460 Z" fill="url(#orange-energy)" opacity="0.5" filter="url(#plasma-blur)" />
    <path d="M 280 442 L 390 448 L 320 454 Z" fill="#FFEA66" filter="url(#soft-glow)" />
  </g>

  <!-- MAIN CHARACTER: RUNNER FAST ENEMY -->
  <g id="runner-sprite">

    <!-- 1. BACK LIMBS (LEFT SIDE - IN SHADOW) -->
    <g id="back-arm">
      <!-- Back Arm Upper -->
      <path d="M 270 200 L 190 170 L 175 190 L 250 220 Z" fill="url(#obsidian-body)" />
      <!-- Back Arm Forearm & Blade -->
      <path d="M 190 170 L 100 130 L 130 120 L 205 160 Z" fill="url(#gold-dark)" />
      <path d="M 120 135 L 30 90 L 90 120 Z" fill="url(#blade-beam)" filter="url(#soft-glow)" />
    </g>

    <g id="back-leg">
      <!-- Back Thigh -->
      <path d="M 210 270 L 120 295 L 105 265 L 190 240 Z" fill="url(#obsidian-body)" />
      <path d="M 195 248 L 125 288 L 135 260 Z" fill="url(#gold-dark)" />
      <!-- Back Calf / Shin Armor -->
      <path d="M 120 295 L 45 325 L 60 345 L 110 325 Z" fill="url(#obsidian-body)" />
      <path d="M 50 328 L -10 345 L 35 348 Z" fill="url(#orange-energy)" filter="url(#soft-glow)" />
      <!-- Joint Energy Core -->
      <circle cx="120" cy="295" r="7" fill="url(#orange-energy)" filter="url(#soft-glow)" />
    </g>

    <!-- 2. MAIN TORSO AND SPINE INNER STRUCTURE -->
    <g id="torso-base">
      <!-- Abdominal Bio-Mesh -->
      <path d="M 220 250 C 240 230, 270 220, 310 215 C 300 250, 270 280, 235 285 Z" fill="url(#obsidian-body)" />
      <!-- Inner Glowing Ribs / Energy Vents -->
      <path d="M 245 255 Q 275 235 305 230" stroke="#FF5500" stroke-width="4" fill="none" filter="url(#soft-glow)" />
      <path d="M 240 268 Q 265 250 290 248" stroke="#FF7700" stroke-width="3.5" fill="none" filter="url(#soft-glow)" />
      <path d="M 235 278 Q 255 265 275 263" stroke="#FFAA00" stroke-width="3" fill="none" filter="url(#soft-glow)" />

      <!-- Energetic Spine Nodes -->
      <path d="M 200 245 Q 220 235 240 230" stroke="#FFD500" stroke-width="5" stroke-linecap="round" filter="url(#ultra-glow)" />
    </g>

    <!-- 3. FRONT LEG (RIGHT LEG - DYNAMIC SPRINTING) -->
    <g id="front-leg">
      <!-- Hip Joint Armor -->
      <path d="M 240 250 C 265 240, 285 260, 270 285 C 245 295, 230 275, 240 250 Z" fill="url(#gold-dark)" />
      <circle cx="255" cy="268" r="9" fill="url(#obsidian-body)" />
      <circle cx="255" cy="268" r="5" fill="#FF5500" filter="url(#soft-glow)" />

      <!-- Main Thigh Muscle/Armor -->
      <path d="M 260 275 L 345 325 L 325 350 L 240 290 Z" fill="url(#obsidian-highlight)" />
      <!-- Thigh Gold Plate -->
      <path d="M 270 270 L 355 320 L 335 335 L 265 285 Z" fill="url(#gold-bright)" />
      <path d="M 290 287 L 348 320 L 340 326 L 285 293 Z" fill="#FFFFFF" opacity="0.6" />

      <!-- Knee Guard & Thruster -->
      <path d="M 345 315 L 385 335 L 340 360 Z" fill="url(#gold-bright)" />
      <path d="M 350 325 L 395 340 L 360 348 Z" fill="url(#orange-energy)" filter="url(#soft-glow)" />

      <!-- Shin / Calf Armor (Thrusting Down Forward) -->
      <path d="M 335 350 L 310 440 L 290 430 L 320 355 Z" fill="url(#obsidian-body)" />
      <path d="M 330 355 L 315 445 L 332 410 L 340 365 Z" fill="url(#gold-bright)" />

      <!-- Glowing Calf Vent Strip -->
      <path d="M 325 365 L 308 430" stroke="#FF3300" stroke-width="4" filter="url(#ultra-glow)" />
      <path d="M 325 365 L 308 430" stroke="#FFEE00" stroke-width="1.5" />

      <!-- Ankle & Sharp Cyber Foot -->
      <path d="M 310 440 L 350 455 L 340 465 L 285 445 Z" fill="url(#obsidian-highlight)" />
      <!-- Talon / Toe Blade -->
      <path d="M 335 448 L 385 468 L 330 465 Z" fill="url(#gold-bright)" />
      <path d="M 345 455 L 410 472 L 360 468 Z" fill="url(#blade-beam)" filter="url(#soft-glow)" />
    </g>

    <!-- 4. MAIN BODY CARAPACE & CHEST ARMOR -->
    <g id="chest-carapace">
      <!-- Main Upper Torso Block -->
      <path d="M 260 220 C 290 190, 340 185, 365 210 C 340 240, 290 260, 260 220 Z" fill="url(#obsidian-body)" />

      <!-- Layered Aerodynamic Gold Breastplate -->
      <path d="M 285 215 C 315 180, 360 175, 385 200 C 365 220, 335 240, 285 215 Z" fill="url(#gold-bright)" />
      <path d="M 300 210 C 325 185, 360 180, 375 200 C 355 215, 335 225, 300 210 Z" fill="url(#gold-dark)" />

      <!-- Radiant Bio-Core Center (Chest Heart) -->
      <ellipse cx="335" cy="210" rx="14" ry="8" transform="rotate(-20 335 210)" fill="url(#core-sun)" filter="url(#ultra-glow)" />
      <ellipse cx="335" cy="210" rx="6" ry="3" transform="rotate(-20 335 210)" fill="#FFFFFF" />

      <!-- Aerodynamic Collar / Neck Guard -->
      <path d="M 320 180 L 365 145 L 380 175 L 345 195 Z" fill="url(#gold-bright)" />
      <path d="M 340 165 L 385 135 L 375 170 Z" fill="url(#orange-energy)" filter="url(#soft-glow)" />
    </g>

    <!-- 5. FRONT ARM & WEAPON (RIGHT ARM - STRIKING/BALANCING) -->
    <g id="front-arm">
      <!-- Shoulder Armor Pad (Sleek Wing Shape) -->
      <path d="M 290 195 C 310 150, 365 140, 395 165 C 365 185, 330 205, 290 195 Z" fill="url(#gold-bright)" />
      <path d="M 315 175 C 335 150, 370 145, 390 160 C 370 175, 345 190, 315 175 Z" fill="url(#obsidian-body)" />
      <path d="M 335 170 C 350 155, 375 150, 395 165 Z" stroke="#FF7700" stroke-width="3" fill="none" filter="url(#soft-glow)" />

      <!-- Bicep / Elbow -->
      <path d="M 350 190 L 415 225 L 395 245 L 340 205 Z" fill="url(#obsidian-highlight)" />

      <!-- Forearm Gauntlet -->
      <path d="M 405 215 L 475 240 L 445 265 L 390 235 Z" fill="url(#gold-bright)" />
      <!-- Gauntlet Gold Segment Cut -->
      <path d="M 415 220 L 485 242 L 465 252 L 405 232 Z" fill="url(#gold-dark)" />

      <!-- Energy Wrist Blade / Claws -->
      <path d="M 450 235 L 530 245 L 470 268 Z" fill="url(#blade-beam)" filter="url(#ultra-glow)" />
      <path d="M 460 242 L 515 250 L 475 260 Z" fill="#FFFFFF" />
      <path d="M 440 250 L 495 270 L 455 275 Z" fill="url(#orange-energy)" filter="url(#soft-glow)" />
    </g>

    <!-- 6. HEAD AND AERODYNAMIC HELMET (FOCUS POINT) -->
    <g id="head-helmet">
      <!-- Neck Base -->
      <path d="M 345 165 L 375 140 L 390 155 L 360 175 Z" fill="url(#obsidian-body)" />

      <!-- Main Helmet Crest (Swept Far Back) -->
      <path d="M 340 155 C 310 110, 240 80, 180 75 C 250 90, 310 120, 365 145 Z" fill="url(#gold-bright)" />
      <path d="M 320 135 C 270 100, 220 85, 160 80 C 220 92, 280 112, 335 138 Z" fill="url(#orange-energy)" filter="url(#soft-glow)" />
      <path d="M 350 148 C 300 120, 240 105, 190 100 C 240 108, 290 122, 340 142 Z" fill="url(#obsidian-body)" />

      <!-- Crown Layered Fins -->
      <path d="M 365 140 C 335 100, 280 75, 230 65 C 280 75, 330 95, 385 125 Z" fill="url(#gold-dark)" />
      <path d="M 380 130 C 350 95, 310 75, 270 65 C 310 75, 355 90, 395 120 Z" fill="url(#gold-bright)" />

      <!-- Lower Jaw / Bio-Chasis Face -->
      <path d="M 365 155 L 430 170 L 400 190 L 360 170 Z" fill="url(#obsidian-highlight)" />
      <path d="M 380 160 L 440 172 L 415 185 L 375 170 Z" fill="url(#gold-dark)" />

      <!-- Sleek Angular Face Plate -->
      <path d="M 375 140 L 445 160 L 410 180 L 365 155 Z" fill="url(#obsidian-body)" />

      <!-- HIGH ENERGY VISOR / EYES (VIBRANT GLOW) -->
      <!-- Visor Background Glow Base -->
      <path d="M 385 148 L 460 163 L 400 175 Z" fill="#FF0033" filter="url(#ultra-glow)" />
      <!-- Main Visor Blade -->
      <path d="M 388 147 L 475 165 L 405 174 Z" fill="url(#orange-energy)" filter="url(#soft-glow)" />
      <!-- Inner Hot Visor Core -->
      <path d="M 395 150 L 470 164 L 410 171 Z" fill="#FFFFFF" filter="url(#soft-glow)" />
      <path d="M 410 153 L 465 163 L 420 168 Z" fill="#FFFFA6" />

      <!-- Forehead Dynamic Crest Horn -->
      <path d="M 380 135 L 435 115 L 410 145 Z" fill="url(#gold-bright)" />
      <path d="M 390 133 L 450 110 L 420 140 Z" fill="url(#blade-beam)" filter="url(#soft-glow)" />
    </g>

    <!-- 7. FOREGROUND EXTRA EFFECTS & LIGHTNING ARCS -->
    <g id="foreground-effects">
      <!-- Energy Tendrils on Body -->
      <path d="M 340 320 Q 380 300 370 260" stroke="#FFCC00" stroke-width="1.5" fill="none" filter="url(#soft-glow)" />
      <path d="M 270 220 Q 300 170 350 160" stroke="#FF5500" stroke-width="2" fill="none" filter="url(#soft-glow)" />
      <path d="M 400 230 Q 440 210 460 240" stroke="#FFE600" stroke-width="1.5" fill="none" filter="url(#soft-glow)" />

      <!-- Aerodynamic Wind Cut Lines (Front of Runner) -->
      <path d="M 460 140 C 480 150, 500 170, 510 200" stroke="#FFAA00" stroke-width="2" stroke-dasharray="16 6 4 6" fill="none" opacity="0.8" filter="url(#soft-glow)" />
      <path d="M 480 120 C 505 140, 515 170, 520 220" stroke="#FF3300" stroke-width="1.5" stroke-dasharray="20 10" fill="none" opacity="0.6" filter="url(#soft-glow)" />
      <path d="M 430 270 C 460 285, 490 300, 505 330" stroke="#FFCC00" stroke-width="2" stroke-dasharray="12 8" fill="none" opacity="0.7" filter="url(#soft-glow)" />

      <!-- High-Speed Lens Sparkles -->
      <polygon points="465,163 475,160 468,166 478,168 467,168 465,175 463,168 455,167 462,165" fill="#FFFFFF" filter="url(#soft-glow)" />
      <polygon points="520,245 530,240 523,248 535,250 522,251 520,260 517,251 508,249 516,247" fill="#FFEA66" filter="url(#ultra-glow)" />
      <polygon points="380,466 390,463 384,470 395,472 383,473 381,482 378,473 369,471 377,469" fill="#FF5500" filter="url(#soft-glow)" />
    </g>

  </g>
</svg>