<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-base" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#2d124d"/>
      <stop offset="50%" stop-color="#180a2e"/>
      <stop offset="100%" stop-color="#080312"/>
    </radialGradient>
    
    <radialGradient id="bg-solar-glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#ff5500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#180a2e" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold & Metallic Gradients -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff3a1"/>
      <stop offset="50%" stop-color="#fdd835"/>
      <stop offset="75%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>

    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe57f"/>
      <stop offset="30%" stop-color="#ffb300"/>
      <stop offset="70%" stop-color="#b76b00"/>
      <stop offset="100%" stop-color="#4a2800"/>
    </linearGradient>

    <linearGradient id="gold-dark-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#795548"/>
      <stop offset="40%" stop-color="#3e2723"/>
      <stop offset="70%" stop-color="#1b0000"/>
      <stop offset="100%" stop-color="#4e2600"/>
    </linearGradient>

    <linearGradient id="frame-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="30%" stop-color="#ffb300"/>
      <stop offset="50%" stop-color="#fff8e1"/>
      <stop offset="70%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </linearGradient>

    <!-- Crystal Facet Gradients -->
    <linearGradient id="facet-top-left" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>

    <linearGradient id="facet-top-right" x1="70%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="40%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ffab00"/>
    </linearGradient>

    <linearGradient id="facet-center-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffff8d"/>
      <stop offset="70%" stop-color="#ffab00"/>
      <stop offset="100%" stop-color="#dd2c00"/>
    </linearGradient>

    <linearGradient id="facet-mid-left" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#ffd740"/>
      <stop offset="50%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#a70000"/>
    </linearGradient>

    <linearGradient id="facet-mid-right" x1="100%" y1="30%" x2="0%" y2="70%">
      <stop offset="0%" stop-color="#ffab00"/>
      <stop offset="60%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </linearGradient>

    <linearGradient id="facet-back-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#3e0000"/>
    </linearGradient>

    <linearGradient id="facet-back-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#4d0000"/>
    </linearGradient>

    <!-- Solar Core & Ray Gradients -->
    <radialGradient id="solar-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffff00"/>
      <stop offset="50%" stop-color="#ff6d00"/>
      <stop offset="80%" stop-color="#ff1744" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b71c1c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sun-ray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffe082" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ff6f00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="flare-streak" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffe082" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ffe082" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Energy Channel -->
    <linearGradient id="energy-channel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffff00"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Base Icon Background Tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg-base)" stroke="url(#frame-border)" stroke-width="6" filter="url(#shadow-dark)"/>
  <rect x="26" y="26" width="460" height="460" rx="86" fill="none" stroke="#ffe082" stroke-width="1.5" opacity="0.3"/>
  <circle cx="256" cy="200" r="190" fill="url(#bg-solar-glow)"/>

  <!-- SACRED GEOMETRY BACKGROUND -->
  <g opacity="0.3" stroke="url(#gold-bright)" fill="none" stroke-width="1">
    <!-- Outer Solar Ring -->
    <circle cx="256" cy="195" r="150" stroke-dasharray="4 8 12 8"/>
    <circle cx="256" cy="195" r="135"/>
    <circle cx="256" cy="195" r="120" stroke-dasharray="2 6"/>
    
    <!-- Concentric Star / Dodecagram Lines -->
    <path d="M256,45 L256,345 M106,195 L406,195 M150,89 L362,301 M150,301 L362,89"/>
    <path d="M117,126 L395,264 M117,264 L395,126 M187,56 L325,334 M187,334 L325,56"/>
    
    <!-- Sacred Geometric Concentric Polygons -->
    <polygon points="256,60 373,127 373,263 256,330 139,263 139,127"/>
    <polygon points="256,75 360,195 256,315 152,195"/>
    <polygon points="214,75 298,75 340,117 340,201 298,243 214,243 172,201 172,117" transform="rotate(15 256 195)"/>
  </g>

  <!-- RADIATING SOLAR SUNBURST BEAMS -->
  <g filter="url(#glow-soft)">
    <!-- 12 Rotated Rays -->
    <g transform="translate(256, 195)">
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(30)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(60)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(90)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(120)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(150)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(180)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(210)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(240)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(270)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(300)"/>
      <path d="M-15,-195 L15,-195 L5,0 L-5,0 Z" fill="url(#sun-ray)" transform="rotate(330)"/>
    </g>
  </g>

  <!-- SACRED TEMPLE PEDESTAL (BASE) -->
  <g id="pedestal" filter="url(#shadow-dark)">
    <!-- Base Shadow Ground -->
    <ellipse cx="256" cy="455" rx="150" ry="24" fill="#000000" opacity="0.7"/>

    <!-- Bottom Tier 3 - Octagonal Plinth -->
    <path d="M 126 440 L 166 418 L 346 418 L 386 440 L 356 465 L 156 465 Z" fill="url(#gold-dark-metal)" stroke="url(#gold-metal)" stroke-width="2"/>
    <path d="M 156 465 L 166 440 L 346 440 L 356 465 Z" fill="url(#gold-metal)" opacity="0.3"/>

    <!-- Tier 2 - Sacred Geometry Ring Moldings -->
    <path d="M 156 418 L 186 392 L 326 392 L 356 418 L 326 435 L 186 435 Z" fill="url(#gold-dark-metal)" stroke="url(#frame-border)" stroke-width="2"/>
    <ellipse cx="256" cy="405" rx="100" ry="16" fill="none" stroke="url(#gold-bright)" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Tier 1 - Altar Top Core -->
    <ellipse cx="256" cy="385" rx="76" ry="18" fill="url(#gold-dark-metal)" stroke="url(#gold-bright)" stroke-width="2.5"/>
    <ellipse cx="256" cy="385" rx="58" ry="12" fill="#120600" stroke="url(#gold-metal)" stroke-width="1.5"/>

    <!-- Magma Solar Energy Pool in Altar Center -->
    <ellipse cx="256" cy="385" rx="42" ry="8" fill="url(#solar-core)" filter="url(#glow-soft)"/>

    <!-- Energy Pillar (Vertical beam connecting Altar to Crystal Tip) -->
    <path d="M 242 385 L 270 385 L 262 335 L 250 335 Z" fill="url(#energy-channel)" opacity="0.85" filter="url(#glow-heavy)"/>

    <!-- Focus Prongs / Golden Horns (Guiding Energy Upward) -->
    <!-- Left Curved Horn -->
    <path d="M 166 422 C 136 360 166 290 208 255 C 214 257 217 265 210 272 C 178 302 158 355 186 418 Z" fill="url(#gold-metal)" stroke="url(#gold-bright)" stroke-width="1.5"/>
    <path d="M 188 380 C 170 340 185 300 208 255 C 211 258 205 275 194 305 Z" fill="#ffffff" opacity="0.4"/>

    <!-- Right Curved Horn (Mirrored) -->
    <path d="M 346 422 C 376 360 346 290 304 255 C 298 257 295 265 302 272 C 334 302 354 355 326 418 Z" fill="url(#gold-metal)" stroke="url(#gold-bright)" stroke-width="1.5"/>
    <path d="M 324 380 C 342 340 327 300 304 255 C 301 258 307 275 318 305 Z" fill="#ffffff" opacity="0.3"/>

    <!-- Front Center Mini Prong -->
    <path d="M 244 400 C 240 375 248 355 256 340 C 264 355 272 375 268 400 Z" fill="url(#gold-metal)" stroke="url(#gold-bright)" stroke-width="1"/>
  </g>

  <!-- FLOATING SOLAR CRYSTAL PRISM (MAIN ARTIFACT) -->
  <g id="main-crystal">
    <!-- Deep Glowing Solar Core Sphere (Inside Crystal) -->
    <circle cx="256" cy="195" r="54" fill="url(#solar-core)" filter="url(#glow-heavy)"/>
    <circle cx="256" cy="195" r="30" fill="#ffffff" filter="url(#glow-intense)"/>

    <!-- BACK FACETS (Darker / Refractive Depth) -->
    <polygon points="256,45 185,185 256,195" fill="url(#facet-back-left)"/>
    <polygon points="256,45 327,185 256,195" fill="url(#facet-back-right)"/>
    <polygon points="185,185 256,345 210,245" fill="url(#facet-back-left)"/>
    <polygon points="327,185 256,345 302,245" fill="url(#facet-back-right)"/>

    <!-- FRONT FACETS (High Polish Golden Glass) -->
    <!-- Top Apex Left -->
    <polygon points="256,45 215,205 256,195" fill="url(#facet-top-left)" opacity="0.9"/>
    <!-- Top Apex Right -->
    <polygon points="256,45 256,195 297,205" fill="url(#facet-top-right)" opacity="0.9"/>
    <!-- Top Outer Left -->
    <polygon points="256,45 185,185 215,205" fill="url(#facet-mid-left)"/>
    <!-- Top Outer Right -->
    <polygon points="256,45 297,205 327,185" fill="url(#facet-mid-right)"/>

    <!-- Mid Belt Front Left -->
    <polygon points="215,205 210,245 256,260 256,195" fill="url(#facet-center-front)"/>
    <!-- Mid Belt Front Right -->
    <polygon points="256,195 256,260 302,245 297,205" fill="url(#facet-top-right)"/>
    <!-- Mid Belt Outer Left -->
    <polygon points="185,185 210,245 215,205" fill="url(#facet-mid-left)"/>
    <!-- Mid Belt Outer Right -->
    <polygon points="297,205 302,245 327,185" fill="url(#facet-mid-right)"/>

    <!-- Bottom Tip Front Left -->
    <polygon points="256,260 256,345 210,245" fill="url(#facet-center-front)" opacity="0.95"/>
    <!-- Bottom Tip Front Right -->
    <polygon points="256,260 302,245 256,345" fill="url(#facet-top-left)" opacity="0.85"/>

    <!-- CRYSTAL INNER REFLECTION LINES & SACRED CUTS -->
    <g stroke="url(#gold-bright)" stroke-width="1.5" stroke-linejoin="round" fill="none" opacity="0.9">
      <!-- Main Outer Structure Wireframe -->
      <path d="M256,45 L185,185 L210,245 L256,345 L302,245 L327,185 Z"/>
      <!-- Inner Vertex Ridge Lines -->
      <path d="M256,45 L256,195 L256,260 L256,345"/>
      <path d="M256,195 L215,205 L210,245 L256,260 L302,245 L297,205 L256,195"/>
      <path d="M256,45 L215,205"/>
      <path d="M256,45 L297,205"/>
      <path d="M185,185 L215,205"/>
      <path d="M327,185 L297,205"/>
    </g>

    <!-- Super Bright Pure White Specular Sheen Overlays -->
    <polygon points="256,45 215,205 228,190" fill="#ffffff" opacity="0.6"/>
    <polygon points="256,195 215,205 230,228" fill="#ffffff" opacity="0.4"/>
    <polygon points="256,260 256,345 242,275" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- ORBITING SATELLITE PRISMS & ENERGY RINGS -->
  <!-- Levitating Halo Ring around Crystal Center -->
  <g transform="rotate(-12 256 195)" filter="url(#glow-soft)">
    <ellipse cx="256" cy="195" rx="115" ry="28" fill="none" stroke="url(#gold-bright)" stroke-width="2" stroke-dasharray="70 15 30 15"/>
    <ellipse cx="256" cy="195" rx="115" ry="28" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="15 60 10 40" opacity="0.7"/>
  </g>

  <!-- Left Satellite Crystal -->
  <g transform="translate(115, 185) scale(0.4)" filter="url(#glow-soft)">
    <polygon points="256,45 200,185 256,305 312,185" fill="url(#facet-center-front)"/>
    <polygon points="256,45 256,305 312,185" fill="url(#facet-mid-right)"/>
    <path d="M256,45 L200,185 L256,305 L312,185 Z M256,45 L256,305" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="175" r="30" fill="url(#solar-core)"/>
  </g>

  <!-- Right Satellite Crystal -->
  <g transform="translate(397, 185) scale(0.4)" filter="url(#glow-soft)">
    <polygon points="256,45 200,185 256,305 312,185" fill="url(#facet-top-left)"/>
    <polygon points="256,45 200,185 256,305" fill="url(#facet-mid-left)"/>
    <path d="M256,45 L200,185 L256,305 L312,185 Z M256,45 L256,305" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="256" cy="175" r="30" fill="url(#solar-core)"/>
  </g>

  <!-- LIGHT FLARES, SPARKLES & SUN DUST HIGH DETAILS -->
  <!-- Massive Horizontal Optical Lens Flare -->
  <ellipse cx="256" cy="195" rx="170" ry="4" fill="url(#flare-streak)" filter="url(#glow-soft)"/>
  <ellipse cx="256" cy="195" rx="80" ry="8" fill="url(#flare-streak)" filter="url(#glow-intense)"/>

  <!-- Center Apex Lens Star Flares -->
  <!-- Top Apex Flare -->
  <g transform="translate(256, 45)" filter="url(#glow-soft)">
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#ffffff"/>
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#fff59d"/>
  </g>
  
  <!-- Center Core Flare -->
  <g transform="translate(256, 195)" filter="url(#glow-soft)">
    <polygon points="0,-28 6,-6 28,0 6,6 0,28 -6,6 -28,0 -6,-6" fill="#ffffff"/>
    <polygon points="0,-15 3,-3 15,0 3,3 0,15 -3,3 -15,0 -3,-3" fill="#ffe082"/>
  </g>

  <!-- Bottom Tip Flare -->
  <g transform="translate(256, 345)" filter="url(#glow-soft)">
    <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="#ffffff"/>
  </g>

  <!-- Floating Golden Sun Dust Particles -->
  <g fill="#ffffff" filter="url(#glow-soft)">
    <circle cx="210" cy="120" r="3" fill="#fff9c4" opacity="0.9"/>
    <circle cx="305" cy="110" r="2.5" fill="#ffe082" opacity="0.8"/>
    <circle cx="170" cy="230" r="2" fill="#ffff8d" opacity="0.7"/>
    <circle cx="340" cy="240" r="3.5" fill="#fff59d" opacity="0.85"/>
    <circle cx="280" cy="310" r="1.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="230" cy="330" r="2.2" fill="#ffe082" opacity="0.75"/>
    <circle cx="140" cy="160" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="370" cy="150" r="2" fill="#fff59d" opacity="0.8"/>
    <circle cx="256" cy="100" r="3" fill="#ffffff" opacity="0.95"/>
    <circle cx="190" cy="280" r="2.5" fill="#ffb300" opacity="0.7"/>
    <circle cx="320" cy="280" r="1.5" fill="#ffff8d" opacity="0.8"/>
  </g>
</svg>