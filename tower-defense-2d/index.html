<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Oh My TD · v0.4.0</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #0b0c10;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        touch-action: manipulation;
      }

      /* APP LAYOUT - 4 Parts Strict Flow */
      .app-layout {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        overflow: hidden;
      }

      .layout-part-1 {
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        width: 100%;
        z-index: 20;
        pointer-events: none;
      }

      .layout-part-2 {
        flex-shrink: 0;
        z-index: 20;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      #game-area {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
        position: relative;
      }

      .layout-part-4 {
        flex-shrink: 0;
        z-index: 20;
        pointer-events: none;
      }

      .layout-modals {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 30;
      }

      canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        /* O press-and-hold do tip de tile nao pode disparar as reacoes nativas
           de toque: lupa/callout do iOS, selecao de texto e scroll/zoom. */
        touch-action: none;
        user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
      }

      .pointer-events-auto {
        pointer-events: auto;
      }

      /* 1. TOP HUD STATUS BAR */
      .hud-top {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: rgba(18, 18, 26, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        z-index: 20;
      }

      .game-title-bar {
        display: flex;
        align-items: baseline;
        pointer-events: none;
        z-index: 20;
      }

      .game-title {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }

      .game-version {
        font-size: 0.85rem;
        font-weight: 600;
        color: #aaaaaa;
        letter-spacing: 1px;
        margin-left: 6px;
      }

      .hud-stats-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        background: rgba(18, 18, 26, 0.88);
        backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        box-sizing: border-box;
        max-width: min(100%, var(--canvas-width, 840px));
        overflow-x: auto;
        scrollbar-width: none;
-webkit-overflow-scrolling: touch;
      }

      .hud-stats-bar::-webkit-scrollbar {
        display: none;
      }

      .hud-stat-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-weight: 700;
        font-size: 0.9rem;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .hud-stat-badge.hp { color: #ff5252; }
      .hud-stat-badge.gold { color: #ffd700; }
      .hud-stat-badge.wave { color: #40c4ff; }

      .wave-title {
        font-size: 0.75rem;
        color: #aaaaaa;
        letter-spacing: 0.5px;
      }

      .boss-badge {
        background-color: #d50000;
        color: #ffffff;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        animation: bossPulse 1s infinite ease-in-out;
      }

      @keyframes bossPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      .hud-btn {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 140ms ease-out, background 140ms ease;
      }

      .hud-btn:hover { background: rgba(255, 255, 255, 0.16); }
      .hud-btn:active { transform: scale(0.95); }
      .hud-btn.active { background: #e040fb; border-color: #ea80fc; }
      .hud-btn.highlight-btn {
        border: 1px solid #ffca28;
        box-shadow: 0 0 8px rgba(255, 202, 40, 0.4);
      }
      .hud-btn.highlight-btn:hover {
        background: rgba(255, 202, 40, 0.2);
        box-shadow: 0 0 12px rgba(255, 202, 40, 0.6);
      }

      /* 2. FIXED RED ZONE ACTION TOOLBAR (Just below top bar, above map) */
      .action-toolbar {
        width: min(100%, var(--canvas-width, 840px));
        max-width: var(--canvas-width, 840px);
        padding: 6px 14px;
        background: rgba(18, 18, 26, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        box-shadow: 0 10px 36px rgba(0, 0, 0, 0.55);
        box-sizing: border-box;
      }
      .toolbar-state {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toolbar-state.hidden {
        display: none !important;
        opacity: 0;
        pointer-events: none;
      }

      .toolbar-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }
      .toolbar-label {
        font-size: 0.72rem;
        font-weight: 800;
        color: #90caf9;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

.toolbar-items-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.toolbar-items-row::-webkit-scrollbar {
  display: none;
}
      .toolbar-card {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 5px 10px;
        color: #ffffff;
        cursor: pointer;
        white-space: nowrap;
        transition: transform 140ms ease-out, background 140ms ease, border-color 140ms ease;
      }

      .toolbar-card:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .toolbar-card:active {
        transform: scale(0.96);
      }

      .toolbar-card.active {
        background: rgba(33, 150, 243, 0.24);
        border-color: #40c4ff;
        box-shadow: 0 0 10px rgba(64, 196, 255, 0.3);
      }

      .toolbar-card:disabled, .toolbar-card.disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none !important;
      }

      .tower-card-icon {
        width: 20px;
        height: 20px;
        object-fit: contain;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .dot.basic { background: #4caf50; }
      .dot.frost { background: #00bcd4; }
      .dot.solar { background: #ffb300; }
      .dot.cannon { background: #ff5722; }
      .dot.artillery { background: #9c27b0; }

      .toolbar-card .name {
        font-size: 0.82rem;
        font-weight: 700;
      }

      .toolbar-card .cost {
        font-size: 0.75rem;
        color: #ffd700;
        font-weight: 600;
      }

      .toolbar-divider {
        width: 1px;
        height: 24px;
        background: rgba(255, 255, 255, 0.15);
      }

      .toolbar-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 5px 10px;
        color: #ffffff;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition: transform 140ms ease-out, background 140ms ease;
      }

      .toolbar-chip:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .toolbar-chip:active {
        transform: scale(0.96);
      }

      .toolbar-chip.active {
        background: rgba(224, 64, 251, 0.25);
        border-color: #e040fb;
        box-shadow: 0 0 10px rgba(224, 64, 251, 0.4);
      }

      .toolbar-chip:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .toolbar-chip.mode-blocked {
        opacity: 0.55;
        cursor: not-allowed !important;
        background: rgba(244, 67, 54, 0.15) !important;
        border-color: rgba(244, 67, 54, 0.4) !important;
        text-decoration: line-through solid #ff5252;
      }

      .toolbar-chip.mode-blocked .cost {
        color: #ff5252 !important;
        text-decoration: none !important;
      }

      .toolbar-chip .cost { color: #ffd700; }
      .toolbar-chip .cd { color: #ff5252; }

      /* INSPECTOR TOOLBAR ROW */
.inspector-toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  flex-wrap: wrap;
  gap: 6px;
}
      .inspector-info-group {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.88rem;
      }

      .stats-summary-inline {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #b0bec5;
        font-size: 0.82rem;
        background: rgba(0, 0, 0, 0.25);
        padding: 4px 10px;
        border-radius: 6px;
      }

.inspector-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
      /* 3. FLOATING TIME CONTROLS (Bottom Right) */
/* 3. FLOATING TIME CONTROLS (Bottom Right) */
.time-controls {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: max(12px, env(safe-area-inset-bottom));
  width: min(calc(100% - 20px), var(--canvas-width, 840px));
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  z-index: 30;
}
      .wave-indicator {
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(18, 18, 26, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
      }

      .wave-indicator-label {
        color: #90caf9;
        font-size: 0.7rem;
        letter-spacing: 0.5px;
      }

      .wave-indicator-dot {
        font-size: 0.6rem;
      }

      .active-mode-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(18, 18, 26, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        color: #ffca28;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        white-space: nowrap;
        transition: background 200ms ease, border-color 200ms ease;
      }

      .active-mode-badge.morte-certa {
        background: rgba(224, 64, 251, 0.25);
        border-color: #e040fb;
        color: #ea80fc;
        box-shadow: 0 0 12px rgba(224, 64, 251, 0.5);
      }

      .speed-btns-group {
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(18, 18, 26, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 3px 5px;
      }

      .speed-btn, .auto-toggle-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: #ffffff;
        padding: 5px 8px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        transition: transform 140ms ease-out, background 140ms ease;
      }

      .speed-btn:hover, .auto-toggle-btn:hover { background: rgba(255, 255, 255, 0.16); }
      .speed-btn:active, .auto-toggle-btn:active { transform: scale(0.95); }
      .speed-btn.active, .auto-toggle-btn.active {
        background: #29b6f6;
        border-color: #81d4fa;
        color: #000000;
      }

      .start-wave-main-btn {
        background: linear-gradient(135deg, #00c853, #64dd17);
        color: #000000;
        border: none;
        border-radius: 8px;
        padding: 6px 14px;
        font-weight: 800;
        font-size: 0.85rem;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 200, 83, 0.4);
        transition: transform 140ms ease-out, box-shadow 140ms ease;
      }

      .start-wave-main-btn:hover {
        transform: scale(1.04);
        box-shadow: 0 6px 20px rgba(0, 200, 83, 0.6);
      }

      .start-wave-main-btn:active { transform: scale(0.96); }

      .start-wave-main-btn.danger {
        background: linear-gradient(135deg, #d50000, #ff1744);
        color: #ffffff;
        box-shadow: 0 4px 16px rgba(213, 0, 0, 0.4);
      }

      .start-wave-main-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }

      /* TOWER SPECIALIZATION CHOICE (level 2 -> 3) */
      .spec-choice {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-top: 6px;
        padding: 7px 9px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 235, 59, 0.35);
      }

      .spec-choice-label {
        font-size: 0.66rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #ffe082;
      }

      .spec-choice-options {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .spec-btn {
        flex: 1 1 150px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        padding: 6px 8px;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: linear-gradient(135deg, #263238, #37474f);
        color: #eceff1;
        cursor: pointer;
        transition: transform 120ms ease-out, border-color 120ms ease;
      }

      .spec-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: #ffeb3b;
      }

      .spec-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .spec-btn-title {
        font-size: 0.72rem;
        font-weight: 800;
      }

      .spec-btn-desc {
        font-size: 0.62rem;
        font-weight: 500;
        line-height: 1.25;
        color: #b0bec5;
      }

      /* WAVE COMPOSITION PREVIEW */
      .wave-preview {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
        max-width: 260px;
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .wave-preview.danger {
        border-color: rgba(255, 23, 68, 0.65);
        background: rgba(70, 0, 0, 0.45);
      }

      .wave-preview-title {
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #b0bec5;
        margin-right: 2px;
      }

      .wave-preview.danger .wave-preview-title { color: #ff8a80; }

      .wave-preview-chip {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: 0.68rem;
        font-weight: 700;
        line-height: 1;
        padding: 3px 5px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.09);
        color: #eceff1;
        white-space: nowrap;
      }

      .wave-preview-chip.boss {
        background: rgba(255, 23, 68, 0.22);
        color: #ff8a80;
      }

      /* BUTTON UTILITIES */
      .btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        color: #ffffff;
        padding: 6px 12px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        transition: transform 140ms ease-out, background 140ms ease;
      }

      .btn:hover { background: rgba(255, 255, 255, 0.16); }
      .btn:active { transform: scale(0.96); }

      .btn.primary { background: #29b6f6; color: #000000; border-color: #81d4fa; }
      .btn.secondary { background: rgba(255, 255, 255, 0.1); }
      .btn.success { background: #4caf50; color: #ffffff; border-color: #81c784; }
      .btn.danger { background: #f44336; color: #ffffff; border-color: #e57373; }

      .close-icon-btn {
        background: transparent;
        border: none;
        color: #aaaaaa;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .close-icon-btn:hover { color: #ffffff; }

      /* MODALS OVERLAYS */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      .modal-card {
        background: #181824;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 24px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      }

      .settings-modal-card { max-width: 520px; }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .modal-header h1 {
        margin: 0;
        font-size: 1.3rem;
        color: #40c4ff;
      }

      .settings-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-height: 60vh;
        overflow-y: auto;
        padding-right: 4px;
        margin-bottom: 16px;
      }

      .settings-section {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .settings-section h3 {
        margin: 0;
        font-size: 0.95rem;
        color: #ffca28;
      }

      .setting-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        gap: 10px;
      }

      .vol-slider { width: 100px; }

      .map-select, .challenge-select {
        background: #252538;
        color: #ffffff;
        border: 1px solid #444466;
        border-radius: 6px;
        padding: 4px 8px;
        font-weight: 700;
        font-size: 0.82rem;
      }

      .hud-stat-badge.challenge {
        color: #ffb74d;
        padding: 3px 6px;
      }

      .hud-stat-badge.map {
        color: #81c784;
        padding: 3px 6px;
      }

      .hud-challenge-select,
      .hud-map-select {
        background: transparent;
        color: #ffffff;
        border: none;
        outline: none;
        font-family: inherit;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        padding: 0 2px;
        transition: color 0.2s ease;
      }

      .hud-challenge-select:hover {
        color: #ffcc80;
      }

      .hud-map-select:hover {
        color: #66bb6a;
      }

      .hud-challenge-select option,
      .hud-map-select option {
        background: #181824;
        color: #ffffff;
      }

      .meta-game-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .modal-restart-btn {
        width: 100%;
        padding: 12px;
        font-size: 0.95rem;
      }

      .changelog-gift-btn {
        background: linear-gradient(135deg, #ff4081, #d500f9);
        color: #ffffff;
        border: 1px solid #ff80ab;
        font-weight: bold;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .changelog-modal-card {
        max-width: 540px;
        max-height: 85vh;
        overflow-y: auto;
      }

      .changelog-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 50vh;
        overflow-y: auto;
      }

      .changelog-item-header {
        display: flex;
        align-items: center;
        gap: 8px;

/* MOBILE RESPONSIVE LAYOUT (<= 768px) */
@media (max-width: 768px) {
  .ui-wrapper { padding: 4px; }
  .layout-part-1 {
    padding: 6px 8px;
  }
  .hud-top {
    padding: 4px 8px;
    gap: 6px;
    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .hud-top::-webkit-scrollbar {
    display: none;
  }
  .layout-part-2 {
    width: 100%;
    padding: 0 6px;
    box-sizing: border-box;
  }
  .hud-stats-bar {
    padding: 4px 8px;
    gap: 6px;
    width: 100%;
    max-width: 100%;
  }

  .action-toolbar {
    padding: 4px 8px;
    margin-top: 4px;
  }

  .toolbar-state {
    gap: 4px;
  }

  .toolbar-row {
    gap: 6px;
  }

  .toolbar-card, .btn, .toolbar-chip, .speed-btn, .start-wave-main-btn {
    min-height: 38px;
    padding: 4px 8px;
  }

  .inspector-toolbar-row {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
  }

  .time-controls {
    bottom: max(8px, env(safe-area-inset-bottom));
    gap: 4px;
  }
  .leaderboard-modal-card, .retro-modal-card {
    width: 96%;
    max-width: 100%;
    padding: 1rem 0.5rem;
  }
  .leaderboard-table th, .leaderboard-table td {
    padding: 4px 6px;
    font-size: 0.75rem;
  }
  .welcome-leaderboard-content, #leaderboard-content {
    overflow-x: auto;
  }
}

@media (max-width: 600px) {
  .changelog-btn-text,
  .hud-btn-text {
    display: none;
  }
  .wave-indicator-label {
    display: none;
  }
}

@media (max-width: 480px) {
  .layout-part-1 {
    padding: 4px 6px;
  }
  .hud-top {
    padding: 4px 6px;
    gap: 4px;
  }
  .hud-stats-bar {
    padding: 3px 6px;
    gap: 4px;
  }
  .hud-stat-badge {
    padding: 3px 5px;
    font-size: 0.75rem;
    gap: 4px;
    flex-shrink: 0;
  }
  .hud-challenge-select,
  .hud-map-select {
    font-size: 0.72rem;
    max-width: 90px;
  }
  .hud-btn {
    padding: 4px 6px;
    font-size: 0.85rem;
  }
  .hud-label-text {
    display: none;
  }
  .toolbar-label {
    display: none;
  }
  .toolbar-card .name {
    font-size: 0.75rem;
  }
  .toolbar-card .cost {
    font-size: 0.7rem;
  }
  .toolbar-chip {
    font-size: 0.75rem;
    padding: 4px 6px;
  }
  .stats-summary-inline {
    font-size: 0.72rem;
    padding: 2px 6px;
    gap: 4px;
  }
  .game-title {
    font-size: 0.9rem;
  }
}

@media (max-height: 500px) {
  .active-mode-badge {
    display: none;
  }
  .action-toolbar {
    margin-top: 2px;
    padding: 3px 6px;
  }
  .hud-top {
    padding: 3px 6px;
  }
  .game-title-bar {
    display: none;
  }
}

@media (max-aspect-ratio: 1/1) {
  .ui-wrapper {
    justify-content: flex-start;
  }
}
