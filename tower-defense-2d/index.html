<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tower Defense 2D · DOM Overlay UI 2.0</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #0b0c10;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        touch-action: manipulation;
      }

      /* 100% Viewport Fixed Canvas */
      #game-area {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      }

      /* UI OVERLAY CONTAINER (Fullscreen, pointer-events: none) */
      .ui-wrapper {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 10px;
        box-sizing: border-box;
      }

      .pointer-events-auto {
        pointer-events: auto;
      }

      /* 1. TOP HUD STATUS BAR */
      .hud-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 840px;
        margin: 0 auto;
        padding: 6px 14px;
        background: rgba(18, 18, 26, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }

      .hud-left-stats {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hud-stat-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-weight: 700;
        font-size: 0.9rem;
      }

      .hud-stat-badge.hp { color: #ff5252; }
      .hud-stat-badge.gold { color: #ffd700; }

      .hud-center-wave {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.06);
        padding: 5px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-weight: 800;
        font-size: 0.9rem;
        color: #40c4ff;
      }

      .wave-title {
        font-size: 0.75rem;
        color: #aaaaaa;
        letter-spacing: 0.5px;
      }

      .boss-badge {
        background-color: #d50000;
        color: #ffffff;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        animation: bossPulse 1s infinite ease-in-out;
      }

      @keyframes bossPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      .hud-btn {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 140ms ease-out, background 140ms ease;
      }

      .hud-btn:hover { background: rgba(255, 255, 255, 0.16); }
      .hud-btn:active { transform: scale(0.95); }
      .hud-btn.active { background: #e040fb; border-color: #ea80fc; }

      /* 2. FIXED RED ZONE ACTION TOOLBAR (Just below top bar, above map) */
      .action-toolbar {
        width: 100%;
        max-width: 840px;
        margin: 6px auto 0 auto;
        padding: 6px 14px;
        background: rgba(18, 18, 26, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        box-shadow: 0 10px 36px rgba(0, 0, 0, 0.55);
        box-sizing: border-box;
      }

      .toolbar-state {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toolbar-state.hidden {
        display: none !important;
        opacity: 0;
        pointer-events: none;
      }

      .toolbar-section {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toolbar-label {
        font-size: 0.72rem;
        font-weight: 800;
        color: #90caf9;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

      .toolbar-items-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .toolbar-card {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 5px 10px;
        color: #ffffff;
        cursor: pointer;
        white-space: nowrap;
        transition: transform 140ms ease-out, background 140ms ease, border-color 140ms ease;
      }

      .toolbar-card:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .toolbar-card:active {
        transform: scale(0.96);
      }

      .toolbar-card.active {
        background: rgba(33, 150, 243, 0.24);
        border-color: #40c4ff;
        box-shadow: 0 0 10px rgba(64, 196, 255, 0.3);
      }

      .toolbar-card:disabled, .toolbar-card.disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none !important;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .dot.basic { background: #4caf50; }
      .dot.frost { background: #00bcd4; }
      .dot.solar { background: #ffb300; }
      .dot.cannon { background: #ff5722; }
      .dot.artillery { background: #9c27b0; }

      .toolbar-card .name {
        font-size: 0.82rem;
        font-weight: 700;
      }

      .toolbar-card .cost {
        font-size: 0.75rem;
        color: #ffd700;
        font-weight: 600;
      }

      .toolbar-divider {
        width: 1px;
        height: 24px;
        background: rgba(255, 255, 255, 0.15);
      }

      .toolbar-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 5px 10px;
        color: #ffffff;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition: transform 140ms ease-out, background 140ms ease;
      }

      .toolbar-chip:hover {
        background: rgba(255, 255, 255, 0.14);
      }

      .toolbar-chip:active {
        transform: scale(0.96);
      }

      .toolbar-chip.active {
        background: rgba(224, 64, 251, 0.25);
        border-color: #e040fb;
        box-shadow: 0 0 10px rgba(224, 64, 251, 0.4);
      }

      .toolbar-chip:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .toolbar-chip .cost { color: #ffd700; }
      .toolbar-chip .cd { color: #ff5252; }

      /* INSPECTOR TOOLBAR ROW */
      .inspector-toolbar-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .inspector-info-group {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.88rem;
      }

      .stats-summary-inline {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #b0bec5;
        font-size: 0.82rem;
        background: rgba(0, 0, 0, 0.25);
        padding: 4px 10px;
        border-radius: 6px;
      }

      .inspector-toolbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* 3. FLOATING TIME CONTROLS (Bottom Right) */
      .time-controls {
        position: fixed;
        right: 16px;
        bottom: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        z-index: 20;
      }

      .speed-btns-group {
        display: flex;
        align-items: center;
        gap: 4px;
        background: rgba(18, 18, 26, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 3px 5px;
      }

      .speed-btn, .auto-toggle-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: #ffffff;
        padding: 5px 8px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        transition: transform 140ms ease-out, background 140ms ease;
      }

      .speed-btn:hover, .auto-toggle-btn:hover { background: rgba(255, 255, 255, 0.16); }
      .speed-btn:active, .auto-toggle-btn:active { transform: scale(0.95); }
      .speed-btn.active, .auto-toggle-btn.active {
        background: #29b6f6;
        border-color: #81d4fa;
        color: #000000;
      }

      .start-wave-main-btn {
        background: linear-gradient(135deg, #00c853, #64dd17);
        color: #000000;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: 800;
        font-size: 0.9rem;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 200, 83, 0.4);
        transition: transform 140ms ease-out, box-shadow 140ms ease;
      }

      .start-wave-main-btn:hover {
        transform: scale(1.04);
        box-shadow: 0 6px 20px rgba(0, 200, 83, 0.6);
      }

      .start-wave-main-btn:active { transform: scale(0.96); }

      .start-wave-main-btn.danger {
        background: linear-gradient(135deg, #d50000, #ff1744);
        color: #ffffff;
        box-shadow: 0 4px 16px rgba(213, 0, 0, 0.4);
      }

      .start-wave-main-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }

      /* BUTTON UTILITIES */
      .btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        color: #ffffff;
        padding: 6px 12px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        transition: transform 140ms ease-out, background 140ms ease;
      }

      .btn:hover { background: rgba(255, 255, 255, 0.16); }
      .btn:active { transform: scale(0.96); }

      .btn.primary { background: #29b6f6; color: #000000; border-color: #81d4fa; }
      .btn.secondary { background: rgba(255, 255, 255, 0.1); }
      .btn.success { background: #4caf50; color: #ffffff; border-color: #81c784; }
      .btn.danger { background: #f44336; color: #ffffff; border-color: #e57373; }

      .close-icon-btn {
        background: transparent;
        border: none;
        color: #aaaaaa;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .close-icon-btn:hover { color: #ffffff; }

      /* MODALS OVERLAYS */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      .modal-card {
        background: #181824;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 24px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      }

      .settings-modal-card { max-width: 520px; }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .modal-header h1 {
        margin: 0;
        font-size: 1.3rem;
        color: #40c4ff;
      }

      .settings-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-height: 60vh;
        overflow-y: auto;
        padding-right: 4px;
        margin-bottom: 16px;
      }

      .settings-section {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .settings-section h3 {
        margin: 0;
        font-size: 0.95rem;
        color: #ffca28;
      }

      .setting-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        gap: 10px;
      }

      .vol-slider { width: 100px; }

      .map-select, .challenge-select {
        background: #252538;
        color: #ffffff;
        border: 1px solid #444466;
        border-radius: 6px;
        padding: 4px 8px;
        font-weight: 700;
        font-size: 0.82rem;
      }

      .meta-game-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .modal-restart-btn {
        width: 100%;
        padding: 12px;
        font-size: 0.95rem;
      }

      .changelog-gift-btn {
        background: linear-gradient(135deg, #ff4081, #d500f9);
        color: #ffffff;
        border: 1px solid #ff80ab;
        font-weight: bold;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .changelog-modal-card {
        max-width: 540px;
        max-height: 85vh;
        overflow-y: auto;
      }

      .changelog-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 50vh;
        overflow-y: auto;
      }

      .changelog-item {
        background: #212130;
        border: 1px solid #3a3a50;
        border-radius: 8px;
        padding: 10px 12px;
      }

      .changelog-item.latest {
        border-color: #e040fb;
        background: #2d1e38;
      }

      .changelog-bullets {
        margin: 0;
        padding-left: 18px;
        font-size: 0.8rem;
      }

      .achievements-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        max-height: 50vh;
        overflow-y: auto;
      }

      .achievement-card {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #222230;
        border: 1px solid #444455;
        border-radius: 8px;
        padding: 8px 12px;
      }

      .achievement-card.unlocked {
        border-color: #ffb300;
        background: #2a2418;
      }

      .hidden { display: none !important; }

      /* MOBILE RESPONSIVE LAYOUT (<= 768px) */
      @media (max-width: 768px) {
        .ui-wrapper { padding: 6px; }
        .hud-top { padding: 6px 10px; }
        .hud-stat-badge { padding: 4px 6px; font-size: 0.8rem; }
        .hud-center-wave { padding: 4px 8px; font-size: 0.8rem; }

        .action-toolbar {
          padding: 6px 8px;
          margin-top: 4px;
        }

        .toolbar-state {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }

        .toolbar-items-row {
          overflow-x: auto;
          width: 100%;
          padding-bottom: 2px;
        }

        .toolbar-card, .btn, .toolbar-chip, .speed-btn, .start-wave-main-btn {
          min-height: 44px;
          min-width: 44px;
        }

        .time-controls {
          right: 6px;
          bottom: 8px;
          flex-direction: row;
          align-items: center;
        }

        .inspector-toolbar-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-area"></div>
    <div id="ui-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
