<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Oh My TD · v0.7.0</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: #0b0c10;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: manipulation;
        -webkit-overflow-scrolling: auto;
      }

      /* APP LAYOUT - 4 Parts Strict Flow */
      .app-layout {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        overflow: hidden;
        position: fixed;
        inset: 0;
      }
      .layout-part-1 {
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        width: 100%;
        z-index: 20;
        pointer-events: none;
      }

      .layout-part-2 {
        flex-shrink: 0;
        z-index: 20;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      #game-area {
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
        position: relative;
      }

      .layout-part-4 {
        flex-shrink: 0;
        min-height: 140px;
        z-index: 20;
        pointer-events: none;
      }

      .layout-modals {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 30;
      }

      canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        /* O press-and-hold do tip de tile nao pode disparar as reacoes nativas
           de toque: lupa/callout do iOS, selecao de texto e scroll/zoom. */
        touch-action: none;
        user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
      }

      .pointer-events-auto {
        pointer-events: auto;
      }

      /* 1. TOP HUD STATUS BAR */
      .hud-top {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: rgba(18, 18, 26, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        z-index: 20;
      }

      .game-title-bar {
        display: flex;
        align-items: baseline;
        pointer-events: none;
        z-index: 20;
      }

      .game-title {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }

      .game-version {
        font-size: 0.85rem;
        font-weight: 600;
        color: #aaaaaa;
        letter-spacing: 1px;
        margin-left: 6px;
      }

      .hud-stats-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        background: rgba(18, 18, 26, 0.88);
        backdrop-filter: blur(14px);
-webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        box-sizing: border-box;
        max-width: min(100%, var(--canvas-width, 840px));
        overflow-x: auto;
        scrollbar-width: none;
-webkit-overflow-scrolling: touch;
      }

      .hud-stats-bar::-webkit-scrollbar {
        display: none;
      }

      .hud-stat-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-weight: 700;
        font-size: 0.9rem;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .hud-stat-badge.hp { color: #ff5252; }
      .hud-stat-badge.gold { color: #ffd700; }
      .hud-stat-badge.wave { color: #40c4ff; }

      .wave-title {
        font-size: 0.75rem;
        color: #aaaaaa;
        letter-spacing: 0.5px;
      }

      .boss-badge {
        background-color: #d50000;
        color: #ffffff;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        animation: bossPulse 1s infinite ease-in-out;
      }

      @keyframes bossPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      .hud-btn {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 1rem;
        cursor: pointer;

      }

      .hud-btn:hover { background: rgba(255, 255, 255, 0.16); }
      .hud-btn:active { transform: scale(0.95); }
      .hud-btn.active { background: #e040fb; border-color: #ea80fc; }
      .hud-btn.highlight-btn {
        border: 1px solid #ffca28;
        box-shadow: 0 0 8px rgba(255, 202, 40, 0.4);
      }
      .hud-btn.highlight-btn:hover {
        background: rgba(255, 202, 40, 0.2);
        box-shadow: 0 0 12px rgba(255, 202, 40, 0.6);
      }

      /* 2. FIXED RED ZONE ACTION TOOLBAR (Just below top bar, above map) */
      .action-toolbar {
        width: min(100%, var(--canvas-width, 840px));
        max-width: var(--canvas-width, 840px);
        padding: 6px 14px;
        background: rgba(18, 18, 26, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        box-shadow: 0 10px 36px rgba(0, 0, 0, 0.55);
        box-sizing: border-box;
      }
      .toolbar-state {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toolbar-state.hidden {
        display: none !important;
        opacity: 0;
        pointer-events: none;
      }

      .toolbar-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
      }
      .toolbar-label {
        font-size: 0.72rem;
        font-weight: 800;
        color: #90caf9;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }

.toolbar-items-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.toolbar-items-row::-webkit-scrollbar {
  display: none;
}

        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;

        cursor: pointer;
        white-space: nowrap;

        border-color: rgba(255, 255, 255, 0.25);
      }

      .toolbar-card:active {

      }

        border-color: #40c4ff;

      }

      .toolbar-card:disabled, .toolbar-card.disabled {

      }

      .tower-card-icon {
        width: 20px;

      }

      .dot {

        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }

      .dot.basic { background: #4caf50; }
      .dot.frost { background: #00bcd4; }
      .dot.solar { background: #ffb300; }
      .dot.cannon { background: #ff5722; }
      .dot.artillery { background: #9c27b0; }

      }

      .toolbar-card .cost {

        font-weight: 600;
      }

      .toolbar-divider {

      }

      .toolbar-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 5px 10px;
        color: #ffffff;
        font-size: 0.8rem;

        cursor: pointer;

        text-decoration: line-through solid #ff5252;

      .toolbar-chip .cost { color: #ffd700; }

.inspector-toolbar-actions {

      /* BUTTON UTILITIES */
      .btn {

      /* Confirmação de venda (D4): 1º clique/tecla arma este estado por
         alguns segundos; um 2º clique/tecla dentro da janela vende de fato. */
      .btn.danger.confirm-pending {
        background: #ff6d00;
        border-color: #ffab40;
        color: #000000;
        animation: sell-confirm-pulse 0.9s infinite ease-in-out;
      }

        50% { box-shadow: 0 0 12px rgba(255, 109, 0, 0.9); }
      }

      /* Toggle switch (Modo Infinito, Háptico) — os inputs já usavam estas
         classes, mas a folha de estilo nunca definiu a aparência: o
         checkbox renderizava nu. */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.25);
        transition: background-color 160ms ease;
      }
      .switch .slider::before {
        position: absolute;
        content: '';
        height: 16px;
        width: 16px;
        left: 2px;
        bottom: 2px;
        background-color: #ffffff;
        transition: transform 160ms ease;
      }
      .switch .slider.round { border-radius: 999px; }
      .switch .slider.round::before { border-radius: 50%; }
      .switch input:checked + .slider { background-color: #29b6f6; border-color: #81d4fa; }
      .switch input:checked + .slider::before { transform: translateX(18px); }
      .switch input:focus-visible + .slider { outline: 2px solid #40c4ff; outline-offset: 2px; }

      .close-icon-btn {
        background: transparent;
        border: none;
        color: #aaaaaa;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .close-icon-btn:hover { color: #ffffff; }

/* MOBILE RESPONSIVE LAYOUT (<= 768px) */
@media (max-width: 768px) {
  .ui-wrapper { padding: 4px; }
  .layout-part-1 {
    padding: 6px 8px;
  }
  .hud-top {
    padding: 4px 8px;
    gap: 6px;
    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .hud-top::-webkit-scrollbar {
    display: none;
  }
  .layout-part-2 {
    width: 100%;
    padding: 0 6px;
    box-sizing: border-box;
  }
  .hud-stats-bar {
    padding: 4px 8px;
    gap: 6px;
    width: 100%;
    max-width: 100%;
  }

  .action-toolbar {
    padding: 4px 8px;
    margin-top: 4px;
  }

  .toolbar-state {
    gap: 4px;
  }

  .toolbar-row {
    gap: 6px;
  }

  /*
   * Piso geral de alvo de toque em 44px (Apple HIG) — subiu de 38px (E2 do
   * GAME_DESIGN_REVIEW.md). tests/mobile_ui_ux.test.ts trava a regressão
   * garantindo que este valor nunca volte a cair abaixo de 38px.
   */
  .toolbar-card, .btn, .toolbar-chip, .speed-btn {
    min-height: 44px;
    padding: 4px 8px;
  }

  /*
   * "Iniciar Onda" é o botão mais pressionado da sessão inteira (uma vez
   * por onda, do início ao fim da run) — não pode ser o menor alvo de
   * toque da tela. Piso de 52px em TODOS os breakpoints (acima do mínimo
   * de 44px/48dp de Apple HIG/Material, porque este é também o elemento
   * que deve se destacar visualmente na barra de tempo).
   * Regressão histórica: esta regra chegou a cair para 32px/28px numa
   * revisão de CSS; ver docs/GAME_DESIGN_REVIEW.md (E2) e
   * tests/mobile_ui_ux.test.ts para o guard-rail automatizado (exige >=48px).
   */
  .start-wave-main-btn {
    padding: 6px 14px;
    font-size: 0.82rem;
    font-weight: 800;
    min-height: 52px;
    /*
     * O rótulo do bônus de chamada antecipada (P1 §3, ex.: "Iniciar Onda 7 ·
     * +18g") é mais longo que os rótulos de hoje e a linha de `.time-controls`
     * é `flex-wrap: nowrap` de propósito (ver nota abaixo, ~L1220) — então o
     * botão precisa poder encolher e quebrar em 2 linhas em vez de empurrar
     * os controles de velocidade para fora da tela (que criaria rolagem
     * horizontal, proibida por convenção do projeto). `min-height` continua
     * sendo só o piso: com bônus visível o botão cresce em altura, nunca
     * em largura além do espaço que a flexbox lhe sobra.
     */
    white-space: normal;
    flex-shrink: 1;
    min-width: 0;
    text-align: center;
    line-height: 1.15;
  }

  .inspector-toolbar-row {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    width: 100%;
  }

  .time-controls {
    bottom: max(8px, env(safe-area-inset-bottom));
    gap: 4px;
    flex-wrap: nowrap;
  }
  .leaderboard-modal-card, .retro-modal-card {
    width: 96%;
    max-width: 100%;
    padding: 1rem 0.5rem;
  }
  .leaderboard-table th, .leaderboard-table td {
    padding: 4px 6px;
    font-size: 0.75rem;
  }
  .welcome-leaderboard-content, #leaderboard-content {
    overflow-x: auto;
  }
}

@media (max-width: 600px) {
  .changelog-btn-text,
  .hud-btn-text {
    display: none;
  }
  .wave-indicator-label {
    display: none;
  }
}

@media (max-width: 480px) {
  .layout-part-1 {
    padding: 4px 6px;
  }
  .hud-top {
    padding: 4px 6px;
    gap: 4px;
  }
  .hud-stats-bar {
    padding: 3px 6px;
    gap: 4px;
  }
  .hud-stat-badge {
    padding: 3px 5px;
    font-size: 0.75rem;
    gap: 4px;
    flex-shrink: 0;
  }
  .hud-challenge-select,
  .hud-map-select {
    font-size: 0.72rem;
    max-width: 90px;
  }
  .hud-btn {
    padding: 4px 6px;
    font-size: 0.85rem;
  }
  .hud-label-text {
    display: none;
  }
  .toolbar-label {
    display: none;
  }
  .toolbar-card .name {
    font-size: 0.75rem;
  }
  .toolbar-card .cost {
    font-size: 0.7rem;
  }
  .toolbar-chip {
    font-size: 0.75rem;
    padding: 4px 6px;
  }
  .stats-summary-inline {
    font-size: 0.72rem;
    padding: 2px 6px;
    gap: 4px;
  }
  .game-title {
    font-size: 0.9rem;
  }
  .speed-buttons, .speed-btns-group {
    gap: 2px;
    padding: 2px 4px;
  }
  /*
   * Este seletor mais específico chegou a sobrepor o piso de 44px do grupo
   * `.toolbar-card, .btn, .toolbar-chip, .speed-btn` (mesma especificidade,
   * cascata decide por ordem — este bloco vem depois) caindo para 28px, a
   * mesma classe de regressão do E2 só que num seletor diferente. Piso de
   * 44px mantido aqui também; só o padding encolhe para caber em ~360px.
   */
  .speed-btn, .auto-toggle-btn {
    padding: 3px 5px;
    font-size: 0.75rem;
    min-height: 44px;
  }
  /*
   * Mesmo piso de 52px do breakpoint anterior — em telas de ~360px de
   * largura o botão de onda não tem largura livre ao lado dos controles de
   * velocidade (.time-controls usa flex-wrap: nowrap). Com o rótulo do
   * bônus de chamada antecipada (P1 §3) o texto fica longo demais para uma
   * linha aqui; em vez de estourar a largura da barra (rolagem horizontal),
   * o botão quebra em 2 linhas e cresce em altura — o piso de 52px nunca
   * é violado, só deixa de ser o teto quando o bônus aparece.
   */
  .start-wave-main-btn {
    padding: 6px 8px;
    font-size: 0.76rem;
    font-weight: 800;
    min-height: 52px;
    white-space: normal;
    flex-shrink: 1;
    min-width: 0;
    text-align: center;
    line-height: 1.15;
  }
  .active-mode-badge {
    padding: 3px 6px;
    font-size: 0.7rem;
  }
}

@media (max-height: 500px) {
  .active-mode-badge {
    display: none;
  }
  .action-toolbar {
    margin-top: 2px;
    padding: 3px 6px;
  }
  .hud-top {
    padding: 3px 6px;
  }
  .game-title-bar {
    display: none;
  }
}

@media (max-aspect-ratio: 1/1) {
  .ui-wrapper {
    justify-content: flex-start;
  }
}

/*
 * E3 (GAME_DESIGN_REVIEW.md): em retrato/mobile a barra de seleção de torres
 * (#action-toolbar) vivia no topo — a zona mais difícil de alcançar com uma
 * mão — enquanto a base, a zona natural do polegar, carregava só velocidade
 * e onda. Construir é a ação mais repetida do jogo; aqui ela desce para uma
 * barra fixa acima dos controles de tempo, e a HUD de recursos (ouro/HP/onda,
 * só leitura) permanece no topo sem nenhuma mudança.
 *
 * `position: fixed` tira o toolbar do fluxo de `#layout-part-2`, que passa a
 * reservar altura só para `.hud-stats-bar` — o `#game-area` (flex: 1) ganha
 * de volta o espaço que o toolbar ocupava no topo.
 *
 * O deslocamento vertical (78px) é uma folga fixa acima de `.time-controls`
 * calculada a partir da altura real da barra de velocidade/onda nestes
 * breakpoints (botão de onda 52px + padding do contêiner ~60px + os 8px de
 * `.time-controls{bottom:}` + uma margem de segurança de ~10px) — não
 * depende de nenhum valor medido em JS, então é seguro mesmo se
 * `.time-controls` ainda não tiver sido pintado no primeiro frame.
 */
@media (max-width: 768px) and (orientation: portrait) {
  #action-toolbar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(78px + env(safe-area-inset-bottom));
    width: min(calc(100% - 20px), var(--canvas-width, 840px));
    z-index: 30;
    max-height: 42vh;
    overflow-y: auto;
    margin-top: 0;
  }
}

/*
 * E5 (GAME_DESIGN_REVIEW.md): no mobile o 1º toque só seleciona o tile e
 * mostra o ghost de construção — nada na tela dizia isso. Este hint é DOM
 * (não canvas) pelo mesmo motivo do tip de tile em E1: texto desenhado no
 * espaço interno 840×600 do canvas fica ilegível em telas pequenas, e aqui
 * ainda precisamos de um botão ✖ clicável de verdade. Posição/visibilidade
 * são controladas via JS em Game.updateBuildHint(); aqui só a aparência.
 */
.build-hint {
  position: absolute;
  transform: translate(-50%, calc(-100% - 10px));
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(12, 16, 20, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 8px;
  padding: 6px 8px 6px 10px;
  font-size: 0.8rem;
  font-weight: 700;
  color: #ffe082;
  white-space: nowrap;
  z-index: 15;
  pointer-events: auto;
}

.build-hint.hidden { display: none !important; }

.build-hint.build-hint-invalid { color: #ff8a80; border-color: rgba(255, 82, 82, 0.5); }

.build-hint-cancel-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 6px;
  color: #ffffff;
  min-width: 36px;
  min-height: 36px;
  font-size: 0.9rem;
  line-height: 1;
  cursor: pointer;
}

.build-hint-cancel-btn:active { transform: scale(0.92); }
